</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="logo"><img class="mark" src="agent.jpg" alt="Агент"><span id="brand-name">ӨРГӨӨ</span></div>
    <nav class="nav">
      <a href="index.html?type=Орон сууц">Орон сууц</a>
      <a href="index.html?type=Оффис">Оффис</a>
      <a href="index.html?type=Газар">Газар</a>
      <a href="index.html?type=Барилга">Барилга</a>
      <a href="index.html#footer">Бидний тухай</a>
    </nav>
    <div class="header-actions">
      <span class="header-phone" id="brand-phone">+976 9911 2233</span>
      <a href="index.html#footer" class="btn btn-accent">Холбоо барих</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="breadcrumb" id="breadcrumb">
    <a href="index.html">Нүүр</a> › <span id="crumb-type"></span> › <b id="crumb-title"></b>
  </div>

  <div id="detail-content">
    <p class="empty-state">Ачааллаж байна...</p>
  </div>
</div>

<footer class="site-footer" style="margin-top:56px;">
  <div class="wrap">
    <div class="footer-bottom">

<button class="chat-launcher" onclick="document.getElementById('chat-panel').classList.toggle('open')">💬</button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-head">
    <div class="avatar"></div>
    <div>
      <strong>ӨРГӨӨ дэмжлэг</strong>
      <span class="status"><span class="dot"></span>Онлайн байна</span>
    </div>
  </div>
  <div class="chat-body">Энэ байрны талаар асуух зүйл байвал бичээрэй.</div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
